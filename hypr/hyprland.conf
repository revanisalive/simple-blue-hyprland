
### MONITORS ###

monitor= DP-3, 1920x1080@165, 0x0, 1

##############################################################################
### MY PROGRAMS ###

$terminal = kitty
$fileManager = nautilus
$menu = tofi-drun --drun-launch=true
$browser = firefox
$editor = gnome-text-editor
$colorPicker = hyprpicker
$steam = steam
$discord = discord
$idlehandler = hypridle
$audio = pavucontrol
$music = celluloid


# --enable-features=UseOzonePlatform --ozone-platform=wayland use this flag to launch CEF/Electron apps in wayland

##############################################################################
### AUTOSTART ###

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/bin/dunst
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprctl setcursor LyraB-cursors 36

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

#################################################################################
### ENVIRONMENT VARIABLES ###

#Cursor#
env = XCURSOR_SIZE,32
env = XCURSOR_THEME, LyraB-cursors
env = HYPRCURSOR_SIZE,32
env = HYPRCURSOR_THEME, LyraB-cursors

#Firefox#
env = MOZ_ENABLE_WAYLAND,1

#QT#
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum

#Toolkit Backend Variables#
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

#XDG Specifications#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#############################################################################
### LOOK AND FEEL ###

general { 
    gaps_in = 5
    gaps_out = 10

    border_size = 3

    col.active_border = rgb(8aadf4)
    col.inactive_border = rgb(5b709b)
    resize_on_border = false 

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 25

    active_opacity = 1
    inactive_opacity = 0.85

    border_part_of_window = true

    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
    }
}

animations {
    enabled = true


     bezier = myBezier, 0.05, 0.9, 0.1, 1.05

     animation = windows, 1, 7, myBezier
     animation = windowsOut, 1, 7, default, popin 80%
     animation = border, 1, 10, default
     animation = borderangle, 1, 8, default
     animation = fade, 1, 7, default
     animation = workspaces, 1, 6, default

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true 
    preserve_split = true
}

master {
    
}

misc { 
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    disable_splash_rendering = true
    vrr = 0
}

###########################################################################
### INPUT ###

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    force_no_accel = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

#########################################################################
### KEYBINDINGSS ###

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, D, exec, $fileManager
bind = $mainMod, S, exec, $steam  
bind = $mainMod, V, exec, $discord
bind = $mainMod, A, exec, $audio
bind = $mainMod, R, exec, $music
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, B, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

#Game Mode - Disables animations & decorations
bind = WIN, F1, exec, ~/.config/hypr/gamemode.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window position with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Screen locking
bind =$mainMod, L, exec, hyprlock

# wlogout
bind = $mainMod, ESCAPE, exec, wlogout

# waybar
bind = Ctrl, Escape, exec, killall waybar || waybar

# Scroll through existing workspaces with mainMod + scroll (or TAB)
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, TAB, workspace, e+1

# Move/resize windows + Mouse
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Screenshot 
# add --cursor flag to include cursor also, --freeze flag to freeze before selection
bind = , F12, exec, grimblast --notify copysave screen 
bind = $mainMod, F12, exec, grimblast --notify copysave active 
bind = SUPER ALT, Print, exec, grimblast --notify copysave area

###################################################################
### WINDOWS AND WORKSPACES ###
## Use hyprctl clients to look for window class

windowrule = match:class io.github.celluloid_player.Celluloid, fullscreen_state 0
windowrule = match:class io.github.celluloid_player.Celluloid, float on
windowrule = match:class io.github.celluloid_player.Celluloid, size 349 240
windowrule = match:class org.pulseaudio.pavucontrol, float on
